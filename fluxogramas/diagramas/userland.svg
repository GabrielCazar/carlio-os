<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo planejado de login e abertura de aplicação</title><desc id="desc">Login delegado a verificador de credenciais, sessão checada por permissões VFS e execução encaminhada a carregador ELF futuro.</desc>
  <defs><style>.bg{fill:#10151d}.box{fill:#192533;stroke:#79d3bd;stroke-width:2;rx:13}.future{stroke:#d5a84e;stroke-dasharray:8 6}.t{fill:#eef5fb;font:700 18px system-ui}.s{fill:#b9c8d5;font:15px system-ui}.a{stroke:#8bd5c1;stroke-width:3;fill:none;marker-end:url(#arr)}.tag{fill:#f4ca6b;font:14px system-ui}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8bd5c1"/></marker></defs>
  <rect class="bg" width="1200" height="700"/><text class="t" x="45" y="48" font-size="28">Userland · contrato inicial</text>
  <rect class="box" x="65" y="110" width="230" height="100"/><text class="t" x="122" y="147">Tela de login</text><text class="s" x="99" y="176">Usuário e senha</text>
  <path class="a" d="M295 160h75"/><rect class="box" x="380" y="110" width="250" height="100"/><text class="t" x="417" y="147">Verificador</text><text class="s" x="411" y="176">backend protegido futuro</text>
  <path class="a" d="M630 160h72"/><rect class="box" x="712" y="110" width="190" height="100"/><text class="t" x="765" y="147">Sessão</text><text class="s" x="743" y="176">uid / gid</text>
  <path class="a" d="M902 160h70"/><rect class="box" x="982" y="110" width="170" height="100"/><text class="t" x="1006" y="147">Catálogo</text><text class="s" x="1008" y="176">/programas</text>
  <path class="a" d="M1067 210v90h-206"/><rect class="box" x="617" y="304" width="330" height="95"/><text class="t" x="708" y="340">Checar permissão x</text><text class="s" x="673" y="368">VFS; nega acesso se não autorizado</text>
  <path class="a" d="M617 351H410"/><rect class="box future" x="65" y="304" width="320" height="95"/><text class="t" x="142" y="340">Carregador ELF</text><text class="s" x="104" y="368">memória isolada e ring 3</text>
  <path class="a" d="M225 399v85"/><rect class="box future" x="65" y="492" width="320" height="95"/><text class="t" x="169" y="528">Scheduler</text><text class="s" x="111" y="556">processo executando</text>
  <rect class="box" x="617" y="492" width="535" height="95"/><text class="t" x="660" y="528">Estado atual</text><text class="s" x="660" y="556">interfaces host testáveis; nenhum programa inicia no kernel ainda</text>
  <text class="tag" x="65" y="635">Login gráfico SDDM, sessão Plasma e execução Arch dependem de ABI Linux e drivers de vídeo/entrada ainda ausentes.</text>
</svg>
