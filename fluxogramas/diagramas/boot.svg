<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de boot atual e modo degradado</title><desc id="desc">Limine inicia kernel, coleta memória, enumera PCI e continua no terminal serial se drivers opcionais não estiverem disponíveis.</desc>
  <defs><style>.bg{fill:#10151d}.step{fill:#192533;stroke:#79d3bd;stroke-width:2;rx:14}.decision{fill:#253340;stroke:#f4ca6b;stroke-width:2}.t{fill:#eef5fb;font:700 18px system-ui}.s{fill:#b9c8d5;font:15px system-ui}.a{stroke:#8bd5c1;stroke-width:3;fill:none;marker-end:url(#arr)}.d{fill:#f4ca6b;font:14px system-ui}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8bd5c1"/></marker></defs>
  <rect class="bg" width="1100" height="760"/><text class="t" x="45" y="48" font-size="28">Inicialização atual · BIOS/UEFI QEMU validado</text>
  <rect class="step" x="365" y="80" width="370" height="70"/><text class="t" x="440" y="111">Firmware → Limine</text><text class="s" x="408" y="135">Carrega kernel x86_64</text>
  <path class="a" d="M550 150v36"/><rect class="step" x="365" y="190" width="370" height="78"/><text class="t" x="413" y="223">Serial, IDT e watchdog PIT</text><text class="s" x="427" y="248">Inicializa diagnóstico em pt_BR</text>
  <path class="a" d="M550 268v38"/><rect class="step" x="365" y="310" width="370" height="84"/><text class="t" x="407" y="345">Mapa Limine e HHDM</text><text class="s" x="405" y="370">Se inválido, desativa acesso DMA/MMIO</text>
  <path class="a" d="M550 394v38"/><rect class="step" x="365" y="436" width="370" height="80"/><text class="t" x="422" y="470">Enumeração PCI somente leitura</text><text class="s" x="402" y="495">AHCI QEMU e classes de vídeo/rede/USB</text>
  <path class="a" d="M550 516v40"/><polygon class="decision" points="550,556 680,620 550,684 420,620"/><text class="t" x="480" y="614">Driver disponível?</text><text class="s" x="486" y="637">e dispositivo presente</text>
  <path class="a" d="M420 620H180v42"/><text class="d" x="218" y="606">não</text><rect class="step" x="45" y="666" width="280" height="66"/><text class="t" x="83" y="696">Modo degradado</text><text class="s" x="64" y="719">Continua no terminal serial</text>
  <path class="a" d="M680 620h235v42"/><text class="d" x="807" y="606">sim</text><rect class="step" x="775" y="666" width="280" height="66"/><text class="t" x="809" y="696">Inicialização limitada</text><text class="s" x="799" y="719">AHCI apenas no QEMU experimental</text>
</svg>
