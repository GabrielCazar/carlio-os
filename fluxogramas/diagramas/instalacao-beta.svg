<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo futuro de instalação segura do CarlioOS</title><desc id="desc">Instalador beta entra em prévia, verifica mídia e sistema existente, exige seleção e confirmação do destino antes de alterar discos.</desc>
  <defs><style>.bg{fill:#10151d}.box{fill:#192533;stroke:#79d3bd;stroke-width:2;rx:14}.warn{fill:#382f1c;stroke:#d5a84e;stroke-width:2;rx:14}.t{fill:#eef5fb;font:700 18px system-ui}.s{fill:#b9c8d5;font:15px system-ui}.a{stroke:#8bd5c1;stroke-width:3;fill:none;marker-end:url(#arr)}.tag{fill:#f4ca6b;font:14px system-ui}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8bd5c1"/></marker></defs>
  <rect class="bg" width="1100" height="690"/><text class="t" x="45" y="50" font-size="28">Instalador para NAS · comportamento exigido</text>
  <rect class="box" x="365" y="82" width="370" height="66"/><text class="t" x="475" y="122">Inicializar ISO</text><path class="a" d="M550 148v35"/>
  <rect class="box" x="300" y="190" width="500" height="82"/><text class="t" x="415" y="224">Modo prévia, sem escrita</text><text class="s" x="376" y="250">Mostrar modelo, serial, tamanho e partições</text><path class="a" d="M550 272v35"/>
  <polygon class="warn" points="550,310 690,376 550,442 410,376"/><text class="t" x="467" y="370">É disco de boot?</text><text class="s" x="480" y="395">ou tem dados?</text>
  <path class="a" d="M410 376H180v52"/><text class="tag" x="245" y="362">sim / incerto</text><rect class="warn" x="45" y="436" width="270" height="82"/><text class="t" x="83" y="470">Recusar destino</text><text class="s" x="67" y="496">Preservar dados existentes</text>
  <path class="a" d="M690 376h230v52"/><text class="tag" x="790" y="362">não; usuário selecionou</text><rect class="box" x="785" y="436" width="270" height="82"/><text class="t" x="816" y="470">Mostrar plano de partição</text><text class="s" x="815" y="496">Pedir confirmação digitada</text><path class="a" d="M920 518v38"/>
  <rect class="box" x="785" y="562" width="270" height="78"/><text class="t" x="816" y="596">Instalar e verificar boot</text><text class="s" x="815" y="620">rollback e recuperação</text>
  <text class="tag" x="45" y="610">Ainda não existe instalador: este fluxograma é requisito, não funcionalidade.</text>
</svg>
