<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Gravação no Hermione v2</title><desc id="desc">Operação copy-on-write grava dado e flush, depois publica uma cópia de diretório alternada. Journal geral ainda não foi implementado.</desc>
  <defs><style>.bg{fill:#10151d}.box{fill:#192533;stroke:#79d3bd;stroke-width:2;rx:14}.warn{fill:#382f1c;stroke:#d5a84e;stroke-width:2;rx:14}.t{fill:#eef5fb;font:700 18px system-ui}.s{fill:#b9c8d5;font:15px system-ui}.a{stroke:#8bd5c1;stroke-width:3;fill:none;marker-end:url(#arr)}.tag{fill:#f4ca6b;font:700 15px system-ui}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8bd5c1"/></marker></defs>
  <rect class="bg" width="1200" height="760"/><text class="t" x="45" y="50" font-size="28">Hermione v2 · gravação copy-on-write atual</text>
  <rect class="box" x="350" y="80" width="500" height="70"/><text class="t" x="488" y="110">Validar nome e volume</text><text class="s" x="433" y="134">Escolher extent livre e montar setor de dados</text>
  <path class="a" d="M600 150v34"/><rect class="box" x="350" y="190" width="500" height="78"/><text class="t" x="478" y="222">Escrever setores novos</text><text class="s" x="442" y="247">Checksums calculados; versão antiga permanece ativa</text>
  <path class="a" d="M600 268v34"/><rect class="box" x="350" y="308" width="500" height="72"/><text class="t" x="542" y="339">FLUSH</text><text class="s" x="425" y="363">Dados devem chegar à mídia antes do commit</text>
  <path class="a" d="M600 380v34"/><rect class="box" x="350" y="420" width="500" height="78"/><text class="t" x="447" y="452">Atualizar diretório inativo</text><text class="s" x="429" y="477">Nova geração com CRC estrutural e entradas validadas</text>
  <path class="a" d="M600 498v34"/><rect class="box" x="350" y="538" width="500" height="72"/><text class="t" x="542" y="569">FLUSH</text><text class="s" x="424" y="593">Remontagem escolhe geração válida mais recente</text>
  <rect class="warn" x="90" y="650" width="1020" height="78"/><text class="tag" x="125" y="680">LIMITE: sem journal geral/replay, teste de corte de energia no QEMU ou garantia contra cache que ignora FLUSH.</text><text class="s" x="125" y="706">Teste host de setor de diretório rasgado passou; CRC32 detecta erro acidental, não autentica os dados.</text>
</svg>
